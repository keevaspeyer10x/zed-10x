name: Zed 10x CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: zed-10x-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-macos-cli:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out the exact pull-request revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Protect packaged CLI launch logging
        run: cargo test --locked -p cli --bin cli

  focused-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact pull-request revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Verify the workflow contract
        run: tests/test_zed_10x_ci_workflows.sh

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          check-latest: true

      - name: Run Zed 10x script regression tests
        run: node --test script/tests/*.test.mjs

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Test GitHub archive extraction
        run: cargo test --locked -p http_client --features github-download

      - name: Test custom agent rename and reconnect compatibility
        run: |
          cargo test --locked -p acp_thread --lib
          cargo test --locked -p project custom_agent_aliases_override_colliding_registry_ids_when_unambiguous --lib
          cargo test --locked -p project explicit_custom_alias_supersedes_colliding_registry_agent --lib
          cargo test --locked -p project registry_display_name --lib
          cargo test --locked -p project remote_agent_ --lib
          cargo test --locked -p project configured_registry_agent_is_pending_until_catalog_resolves --lib
          cargo test --locked -p project remote_execution_host_ --lib
          cargo test --locked -p remote_server test_remote_external_agent_metadata_comes_from_execution_host --lib
          cargo test --locked -p remote_server test_remote_external_agent_server_reconnects_to_latest_inventory --lib
          cargo test --locked -p remote_server test_remote_client_settings_never_replace_execution_host_agents --lib
          cargo test --locked -p agent_ui equivalent_cache_key_prefers_canonical_and_recognizes_legacy_aliases --lib
          cargo test --locked -p agent_ui test_store_update_agent_id_preserves_thread_identity --lib
          cargo test --locked -p agent_ui test_serialize_preserves_session_id_in_load_error --lib
          cargo test --locked -p agent_ui test_retry_load_restarts_transport_and_preserves_session_id --lib
          cargo test --locked -p agent_ui test_retry_load_refreshes_dedicated_transport_and_preserves_session_id --lib
          cargo test --locked -p agent_ui test_drop_shuts_down_dedicated_transport --lib
          cargo test --locked -p agent_ui test_drop --lib
          cargo test --locked -p agent_ui test_retry_after_acp_server_exit_loads_the_original_session --lib
          cargo test --locked -p agent_servers test_custom_agent_dedicated_connection_setting --lib
          cargo test --locked -p agent_ui test_retained_thread_does_not_share_dedicated_agent_connection --lib
          cargo test --locked -p agent_ui test_superseded_dedicated_connection_can_finish_for_existing_owner --lib
          cargo test --locked -p agent_ui test_legacy_alias_resolves_dedicated_policy_before_connection_selection --lib
          cargo test --locked -p agent_ui test_new_external_agent_replaces_mismatched_ephemeral_draft --lib
          cargo test --locked -p agent_ui test_new_workspace_ignores_unavailable_global_last_used_agent --lib
          cargo test --locked -p agent_ui test_pending_registry_agent_waits_for_authoritative_inventory --lib
          cargo test --locked -p agent_ui test_create_thread_with_options_retains_thread_and_restores_agent --lib
          cargo test --locked -p agent_ui test_pending_session_restores_through_its_metadata_agent --lib
          cargo test --locked -p agent_ui test_explicit_agent_selection_cancels_pending_session_restore --lib
          cargo test --locked -p agent_ui test_pending_nonempty_draft_restores_through_its_metadata_agent --lib
          cargo test --locked -p agent_ui test_explicit_agent_selection_cancels_pending_nonempty_draft_restore --lib
          cargo test --locked -p agent_ui test_external_source_prompt_waits_for_pending_agent_and_restores_durably --lib
          cargo test --locked -p agent_ui test_external_source_prompt_requires_manual_send --lib
          cargo test --locked -p agent_ui test_external_source_provenance_rehydrates_warning_without_auto_submit --lib
          cargo test --locked -p agent_ui test_stored_draft_prompt_schema_is_backward_compatible_and_versioned --lib
          cargo test --locked -p agent_ui test_pending_explicit_draft_falls_back_to_native_when_agent_is_removed --lib
          cargo test --locked -p agent_ui test_guarded_user_thread_supersedes_pending_restorations_and_preserves_them --lib
          cargo test --locked -p agent_ui test_native_summary_action_cancels_pending_restoration_before_lookup --lib
          cargo test --locked -p agent_ui test_manual_pending_draft_load_waits_without_constructing_server --lib
          cargo test --locked -p agent_ui test_manual_pending_session_activation_survives_removed_inventory --lib
          cargo test --locked -p agent_ui test_cold_pending_submitted_session_removed_restores_visible_history --lib
          cargo test --locked -p agent_ui test_direct_removed_submitted_session_ignores_stale_external_draft --lib
          cargo test --locked -p agent_ui test_initialize_from_source_transfers_draft_to_fresh_panel --lib
          cargo test --locked -p agent_ui test_initialize_from_source_waits_for_destination_agent_authority --lib
          cargo test --locked -p agent_ui test_new_thread_replaces_removed_empty_draft --lib
          cargo test --locked -p agent_ui test_new_thread_preserves_removed_draft_with_content --lib
          cargo test --locked -p agent_ui test_removed_agent_keeps_submitted_session_visible --lib
          cargo test --locked -p agent_ui test_cold_removed_draft_load_error_preserves_durable_prompt --lib
          cargo test --locked -p settings_ui rename_preserves_original_name_as_alias --lib
          cargo test --locked -p settings_ui rename_back_drops_the_new_canonical_name_from_aliases --lib

      - name: Test remote command-group lifecycle
        run: |
          cargo test --locked -p remote_server --test env_exec unix::env_exec_reaps_a_command_group_that_ignores_transport_eof -- --exact
          cargo test --locked -p remote_server --test env_exec unix::env_exec_reaps_descendants_after_the_direct_command_exits -- --exact
          cargo test --locked -p remote_server --test env_exec unix::env_exec_reaps_its_command_group_when_the_supervisor_is_killed -- --exact
          cargo test --locked -p remote_server --test env_exec unix::env_exec_reaps_its_command_group_when_supervisor_dies_before_identity_report -- --exact
          cargo test --locked -p remote_server --test env_exec unix::env_exec_reaps_its_command_group_when_guardian_dies_before_readiness_report -- --exact
          cargo test --locked -p remote_server --test env_exec unix::env_exec_reaps_its_command_group_when_the_guardian_is_killed -- --exact
          cargo test --locked -p remote_server --test env_exec unix::env_exec_reaps_its_command_group_when_guardian_dies_after_transport_eof -- --exact
          cargo test --locked -p remote_server --test env_exec unix::env_exec_preserves_the_command_exit_identity -- --exact
          cargo test --locked -p remote_server --test env_exec unix::env_exec_guardian_rejects_standard_descriptors -- --exact

      - name: Test the Zed 10x updater and release channel
        run: |
          cargo test --locked -p auto_update zed_10x
          cargo test --locked -p release_channel

      - name: Check the Zed 10x binary
        run: cargo check --locked -p zed --bin zed-10x

      - name: Test the Zed 10x binary
        run: cargo test --locked -p zed --bin zed-10x -- --test-threads=1

  focused-rust:
    if: ${{ always() }}
    needs: [focused-linux, focused-macos-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both platform suites
        run: |
          test "${{ needs.focused-linux.result }}" == 'success'
          test "${{ needs.focused-macos-cli.result }}" == 'success'
