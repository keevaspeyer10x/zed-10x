name: Zed 10x CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: zed-10x-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact pull-request revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Verify the workflow contract
        run: tests/test_zed_10x_ci_workflows.sh

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          check-latest: true

      - name: Run Zed 10x script regression tests
        run: node --test script/tests/*.test.mjs

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Test GitHub archive extraction
        run: cargo test --locked -p http_client --features github-download

      - name: Test custom agent rename and reconnect compatibility
        run: |
          cargo test --locked -p project custom_agent_aliases_override_colliding_registry_ids_when_unambiguous --lib
          cargo test --locked -p project explicit_custom_alias_supersedes_colliding_registry_agent --lib
          cargo test --locked -p project registry_display_name --lib
          cargo test --locked -p project remote_agent_ --lib
          cargo test --locked -p project configured_registry_agent_is_pending_until_catalog_resolves --lib
          cargo test --locked -p project remote_execution_host_ --lib
          cargo test --locked -p remote_server test_remote_external_agent_metadata_comes_from_execution_host --lib
          cargo test --locked -p remote_server test_remote_external_agent_server_reconnects_to_latest_inventory --lib
          cargo test --locked -p remote_server test_remote_client_settings_never_replace_execution_host_agents --lib
          cargo test --locked -p agent_ui equivalent_cache_key_prefers_canonical_and_recognizes_legacy_aliases --lib
          cargo test --locked -p agent_ui test_store_update_agent_id_preserves_thread_identity --lib
          cargo test --locked -p agent_ui test_serialize_preserves_session_id_in_load_error --lib
          cargo test --locked -p agent_ui test_new_workspace_ignores_unavailable_global_last_used_agent --lib
          cargo test --locked -p agent_ui test_pending_registry_agent_waits_for_authoritative_inventory --lib
          cargo test --locked -p agent_ui test_pending_session_restores_through_its_metadata_agent --lib
          cargo test --locked -p agent_ui test_explicit_agent_selection_cancels_pending_session_restore --lib
          cargo test --locked -p agent_ui test_pending_nonempty_draft_restores_through_its_metadata_agent --lib
          cargo test --locked -p agent_ui test_explicit_agent_selection_cancels_pending_nonempty_draft_restore --lib
          cargo test --locked -p agent_ui test_new_thread_replaces_removed_empty_draft --lib
          cargo test --locked -p agent_ui test_new_thread_preserves_removed_draft_with_content --lib
          cargo test --locked -p agent_ui test_removed_agent_keeps_submitted_session_visible --lib
          cargo test --locked -p agent_ui test_cold_removed_draft_load_error_preserves_durable_prompt --lib
          cargo test --locked -p settings_ui rename_preserves_original_name_as_alias --lib
          cargo test --locked -p settings_ui rename_back_drops_the_new_canonical_name_from_aliases --lib

      - name: Test the Zed 10x updater and release channel
        run: |
          cargo test --locked -p auto_update zed_10x
          cargo test --locked -p release_channel

      - name: Check the Zed 10x binary
        run: cargo check --locked -p zed --bin zed-10x

      - name: Test the Zed 10x binary
        run: cargo test --locked -p zed --bin zed-10x -- --test-threads=1
